# pnpm 11+: project config lives here (not package.json#pnpm).
# Root-only repo — packages field omitted; root is always included.

overrides:
  # Percy (cli-pdf ^2.16) still resolves vulnerable pdfjs-dist; audit needs >=4.2.67. Dev-only (visual tests).
  pdfjs-dist: 6.4.299
  # pac-proxy-agent > get-uri (via Percy) still resolves basic-ftp@<=6.2.0; audit needs >=6.2.1.
  basic-ftp: 6.2.2
  # ajv (commitlint/percy) still resolves fast-uri@3.1.7; need >=3.1.8. Stay within ajv's ^3 range.
  fast-uri: 3.1.8
  # Percy still resolves fast-xml-parser@4.x without this; audit needs >=5.7.0.
  fast-xml-parser: 5.11.2

allowBuilds:
  '@parcel/watcher': true
  '@percy/core': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
