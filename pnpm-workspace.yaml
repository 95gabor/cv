# pnpm 11+: project config lives here (not package.json#pnpm).
# Root-only repo — packages field omitted; root is always included.

overrides:
  # Next/babel still resolve browserslist@<=4.28.6 without this (GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g).
  browserslist: 4.28.9
  # ajv (commitlint/percy) still resolves fast-uri@3.1.5; need >=3.1.6 for URI advisories.
  fast-uri: 3.1.7
  # Percy still resolves fast-xml-parser@4.x without this; audit needs >=5.7.0.
  fast-xml-parser: 5.11.1
  # snyk-nodejs-lockfile-parser (via @percy/cli) pins uuid@^8; audit needs >=11.1.1 (GHSA-w5hq-g745-h8pq).
  uuid: 11.1.1

allowBuilds:
  '@parcel/watcher': true
  '@percy/core': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
